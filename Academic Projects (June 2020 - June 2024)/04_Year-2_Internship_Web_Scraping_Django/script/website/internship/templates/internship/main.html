{% extends 'base.html' %}
{% block content %}

<!DOCTYPE html>
    <head>
        {% load static %}
            <title>internship</title>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
            <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inconsolata">
            <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
            <script src="{% static 'js/bootstrap.js' %}"></script>
    
    <style>
        body, html {
            height: 100%;
            font-family: "Inconsolata", sans-serif;
        }

        .menu {
            display: none;
        }

    </style>
    </head>
&nbsp;
{% for InternShip in intern_list %}
<div class="card">
    <div class="card-body">
        <h4 class="card-title">{{InternShip.JOB_DESCRIPTION}}</h4>
        <h6 class="card-subtitle mb-2 text-muted">{{InternShip.LOCATION}}</h6>
        <p class="card-text">{{InternShip.COMPANY}}</p>
        <p class="card-text">{{InternShip.EMPLOYMENT_RATE}}</p>
    </div>
  </div>

&nbsp;
&nbsp;

{% endfor %}
{% endblock  %}
